name: Python SDK qualification and release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['python-v*']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run build
      - run: python -m pip install build twine
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/python-v')
        run: python -c 'import os,tomllib; assert os.environ["GITHUB_REF"] == "refs/tags/python-v" + tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"]'
      - run: python -m build python --outdir dist-python
      - run: python -m twine check --strict dist-python/*
      - run: python python/scripts/release_verify.py --dist dist-python
      - run: python -m pip install --no-deps dist-python/*.whl
      - run: gradia-guard-python doctor
      - run: python python/scripts/smoke_release.py
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: python-distributions
          path: dist-python/
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/python-v')
    needs: qualify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
