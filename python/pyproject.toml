[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gradia-guard"
version = "0.1.0b1"
description = "Proof-bound, coverage-explicit evidence receipts for Python AI systems."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Gradia" }]
keywords = ["ai-governance", "agent-evaluation", "audit-trail", "receipts"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.urls]
Homepage = "https://www.gradiahq.com"
Repository = "https://github.com/rudycelekli/gradia-guard"
Issues = "https://github.com/rudycelekli/gradia-guard/issues"

[project.scripts]
gradia-guard-python = "gradia_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gradia_guard = ["py.typed"]
